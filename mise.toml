[tools]
erlang = "29"
elixir = "1.20-otp-29"

# The pipeline parses upstream TypeScript with `oxc-parser`, and the browser
# suite drives Playwright. Both are Node, so it is pinned rather than assumed.
node = "22"

hk = "1.56.1"
pkl = "0.32.1"

# The storybook deploys to Fly.io.
flyctl = "latest"

# actionlint shells out to shellcheck for every `run:` block. Without it the
# workflow lint reports an error instead of a finding.
actionlint = "latest"
shellcheck = "latest"
gitleaks = "latest"
pinact = "latest"
rumdl = "latest"
tombi = "latest"
typos = "latest"
zizmor = "latest"

[env]
HK_MISE = 1

# Keep the verification servers away from ports that local container tools
# commonly reserve.
STORYBOOK_PORT = "14101"
PARITY_PORT = "14102"

[hooks]
postinstall = "hk install --mise"
