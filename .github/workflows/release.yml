name: Release

# A version in a package's mix.exs that hex does not have yet is a release. Each
# push to main compares every package with hex and publishes the new versions.
# Versions with a `-dev` suffix are work in progress and never publish.
#
# Publishing to hex cannot be taken back after an hour, so the checks run again
# before the publish rather than being trusted from CI on the same commit.
#
# Packages publish in dependency order: live_base, live_shadcn, then
# live_ai_elements. Under HEX_PUBLISH each one depends on the one before it by
# version, so any other order would publish a package whose dependency does not
# exist yet.

on:
  push:
    branches: [main]
    paths: ["packages/*/mix.exs"]
  workflow_dispatch:

# Two publishes of the same version race each other on hex.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  ELIXIR_MAKE_CACHE_DIR: /tmp/live-shadcn-native/elixir-make
  RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH: /tmp/live-shadcn-native/rustler

jobs:
  plan:
    name: find unpublished versions
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - id: plan
        run: |
          publish=()
          for package in live_base live_shadcn live_ai_elements; do
            version=$(grep -m1 -oE '@version "[^"]+"' "packages/$package/mix.exs" | cut -d'"' -f2)
            case "$version" in
              *-dev*) echo "$package $version is a development version"; continue ;;
            esac
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://hex.pm/api/packages/$package/releases/$version")
            case "$status" in
              200) echo "$package $version is on hex already" ;;
              404) echo "$package $version will publish"; publish+=("$package") ;;
              *) echo "::error::hex answered $status for $package $version"; exit 1 ;;
            esac
          done
          echo "packages=${publish[*]}" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.package }}
    needs: plan
    if: needs.plan.outputs.packages != ''
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      fail-fast: true
      matrix:
        package: [packages/live_base, packages/live_shadcn, packages/live_ai_elements, tools/verification, tools]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false

      - run: npm ci
        if: matrix.package == 'tools'
        working-directory: tools

      - run: mix deps.get
        working-directory: ${{ matrix.package }}

      - name: Prepare verified native archives
        run: elixir tools/scripts/prepare-native.exs "$PROJECT"
        env:
          PROJECT: ${{ matrix.package }}

      - name: Prepare tools integration test inputs
        if: matrix.package == 'tools'
        run: |
          mix ui.fetch --locked
          cd ../storybook
          mix deps.get
          elixir ../tools/scripts/prepare-native.exs .
        working-directory: tools

      - run: mix format --check-formatted
        working-directory: ${{ matrix.package }}

      - run: mix compile --warnings-as-errors
        working-directory: ${{ matrix.package }}

      - run: mix test
        working-directory: ${{ matrix.package }}

  ports:
    name: reviewed ports match their contracts
    needs: plan
    if: needs.plan.outputs.packages != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false

      - run: mix deps.get
        working-directory: tools

      # This check needs only the committed contracts and reviewed ports.
      - run: mix ui.spec --check --offline
        working-directory: tools

      - run: mix ui.status --check
        working-directory: tools

      - run: mix ui.status --check --require-verified
        working-directory: tools

  ai-elements-verification:
    needs: plan
    if: needs.plan.outputs.packages != ''
    # Relative workflow calls use this commit. actionlint does not yet accept $/.
    uses: ./.github/workflows/verify-ai-elements.yml # zizmor: ignore[self-repository]

  publish:
    name: publish to hex
    needs: [plan, check, ports, ai-elements-verification]
    runs-on: ubuntu-latest
    environment: hex
    # Each release gets a `<package>-v<version>` tag, which the docs link to as
    # their source ref.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false

      # HEX_PUBLISH swaps each path dependency for a version dependency, because
      # hex refuses a package that carries a path.
      #
      # hex's registry takes a moment to serve a release that was just pushed,
      # and the next package cannot resolve it until it does, so dependency
      # resolution retries. A package that still fails leaves the ones before
      # it published; rerunning the workflow publishes only what is missing.
      - name: Publish
        env:
          HEX_PUBLISH: "1"
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          for package in $PACKAGES; do
            pushd "packages/$package" > /dev/null
            version=$(grep -m1 -oE '@version "[^"]+"' mix.exs | cut -d'"' -f2)

            resolved=""
            for attempt in 1 2 3 4 5 6; do
              if mix deps.get; then resolved=1; break; fi
              echo "a dependency of $package is not in the registry yet; attempt $attempt of 6"
              mix hex.registry 2>/dev/null || true
              sleep 20
            done
            if [ -z "$resolved" ]; then
              echo "::error::$package could not resolve its dependencies. Rerun the workflow."
              exit 1
            fi

            elixir ../../tools/scripts/prepare-native.exs .
            mix hex.publish --yes

            tag="$package-v$version"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null \
              || echo "::warning::$package $version is published, but the tag $tag was not created"
            echo "published $package $version"
            popd > /dev/null
          done
