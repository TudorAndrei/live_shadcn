name: Deploy storybook

# The storybook is a demo, so it deploys when somebody asks rather than on
# every push. Fly's remote builder builds the linux/amd64 image from the
# repository root. The root is the required build context because the
# storybook uses the local packages and registry.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-storybook
  cancel-in-progress: false

jobs:
  deploy:
    name: build the image and deploy it
    runs-on: ubuntu-latest
    environment: storybook
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false

      - name: Deploy
        run: flyctl deploy --remote-only -c storybook/fly.toml .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
