name: Deploy storybook

# The storybook is a demo, so it deploys when somebody asks rather than on
# every push. `wrangler deploy` builds the image where it runs and pushes it to
# Cloudflare, and Containers run linux/amd64 — which is what this runner is.
# Building it on an arm64 machine needs emulation, and the BEAM does not
# survive that.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: build the image and deploy it
    runs-on: ubuntu-latest
    environment: storybook
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"

      - run: npm ci
        working-directory: storybook/deploy

      # The Worker is the only hand-written code in this deployment, and it is
      # 40 lines. Type-checking it costs nothing and catches the rename that a
      # container upgrade brings.
      - run: npm run typecheck
        working-directory: storybook/deploy

      - name: Deploy
        run: npx wrangler deploy
        working-directory: storybook/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
