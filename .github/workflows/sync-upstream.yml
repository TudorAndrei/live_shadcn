name: Sync upstream

# Keeping up with shadcn is a scheduled job, not a person remembering to look.
# The run re-fetches upstream, regenerates, and opens a pull request when the
# digests in registry/UPSTREAM.json move.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: mix deps.get
        working-directory: tools

      - name: Fetch upstream
        run: mix ui.fetch
        working-directory: tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Added once the generator stages land.
      # - run: mix ui.spec && mix ui.gen && mix ui.verify
      #   working-directory: tools

      - name: Summarise the drift
        id: drift
        run: |
          if git diff --quiet -- registry/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<DIFF'
              echo 'Upstream digests moved. Files touched:'
              echo
              git diff --stat -- registry/
              echo DIFF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: sync/upstream
          title: "chore(registry): sync upstream"
          body: ${{ steps.drift.outputs.body }}
          commit-message: "chore(registry): sync upstream"
