name: Sync upstream

# Keeping up with shadcn is a scheduled job, not a person remembering to look.
# The run re-fetches upstream, synchronizes safe facts, and opens a pull request
# when the digests in registry/UPSTREAM.json move.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false

      - run: mix deps.get
        working-directory: tools

      # `mix ui.spec` parses upstream TypeScript with oxc, which is Node.
      - run: npm ci
        working-directory: tools

      - name: Fetch upstream
        run: mix ui.fetch
        working-directory: tools
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The task computes all results before it writes. Manual structural drift
      # stops the run before it changes a port or contract.
      - name: Synchronize safe facts
        run: mix ui.spec
        working-directory: tools

      - name: Redraw the snapshots
        run: mix setup && mix assets.build && mix snapshot
        working-directory: storybook

      # A port that does not match its contract makes later results unreliable.
      - name: Reviewed ports match their contracts
        run: mix ui.spec --check --offline
        working-directory: tools

      # A sync that opens a pull request nobody can trust is worse than none.
      # The browser check runs before the diff is offered, so the pull request
      # says whether upstream still behaves the way it did.
      - name: Behaviour and accessibility
        run: |
          npm ci
          npm run verify:install
          npm run verify
        working-directory: storybook/test/browser
        env:
          CI: "true"

      # What moved, in words. `git diff --stat` would say four files and 807
      # lines, which is true and useless; `mix ui.drift` reads the specs and
      # says whether a class string moved or an attribute appeared.
      - name: Summarise the drift
        id: drift
        run: |
          if git diff --quiet -- registry/ packages/live_shadcn/priv/registry/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "changed=true"
            echo "title=$(cd tools && mix ui.drift --title | tail -1)"
            echo 'body<<DIFF'
            (cd tools && mix ui.drift)
            echo
            echo 'Every reviewed port still matches its contract, and the whole'
            echo 'browser suite is green. Read the snapshot diff to see what'
            echo 'a reader would actually notice.'
            echo DIFF
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: sync/upstream
          title: "chore(registry): ${{ steps.drift.outputs.title }}"
          body: ${{ steps.drift.outputs.body }}
          commit-message: "chore(registry): sync upstream"
