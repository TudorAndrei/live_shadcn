name: Verify AI Elements

on:
  workflow_call:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mix deps.get
        working-directory: tools
      - name: Plan AI component groups
        id: shards
        run: |
          mix ui.verify.plan --source ai_elements --shards 4 --output "$RUNNER_TEMP/ai-matrix.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          matrix = json.loads((Path(os.environ["RUNNER_TEMP"]) / "ai-matrix.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
          PYTHON
        working-directory: tools

  verify:
    name: AI Elements ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: ./.github/actions/setup-browser # zizmor: ignore[self-repository]
      - name: Run assigned authored component checks
        run: mix ui.verify --source ai_elements --shard "$SHARD" --batch-size 8 --output "$RUNNER_TEMP/ai-$SHARD_INDEX.json" --artifacts "$RUNNER_TEMP/ai-browser-$SHARD_INDEX"
        working-directory: tools
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_INDEX: ${{ matrix.index }}
      - name: Save component verification records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-verification-${{ matrix.index }}
          path: ${{ runner.temp }}/ai-${{ matrix.index }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Save failed browser reports and screenshots
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-browser-${{ matrix.index }}
          path: ${{ runner.temp }}/ai-browser-${{ matrix.index }}
          if-no-files-found: ignore
          retention-days: 7

  inventory:
    name: current AI Elements evidence
    needs: [plan, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mix deps.get
        working-directory: tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-verification-*
          path: ${{ runner.temp }}/ai-records
          merge-multiple: true
      - name: Merge all assigned records
        run: node .github/scripts/merge-verification.mjs "$RUNNER_TEMP/ai-records" registry/VERIFY.json
        env:
          VERIFICATION_MATRIX: ${{ needs.plan.outputs.matrix }}
      - name: Require current AI evidence
        run: |
          mix ui.status
          mix ui.status --check --source ai_elements --require-verified
        working-directory: tools
      - run: cat docs/INVENTORY.md >> "$GITHUB_STEP_SUMMARY"
