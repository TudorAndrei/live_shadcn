name: Verify AI Elements

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: all AI Elements authored checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: mix deps.get
        working-directory: tools

      - run: npm ci
        working-directory: tools

      - name: Restore pinned sources
        run: mix ui.fetch --locked
        working-directory: tools
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: mix deps.get
        working-directory: storybook

      - run: npm ci
        working-directory: storybook/assets

      - run: npm ci
        working-directory: parity

      - run: npm ci
        working-directory: storybook/test/browser

      - run: npm run verify:install
        working-directory: storybook/test/browser

      - name: Run every authored component check
        run: mix ui.verify --source ai_elements
        working-directory: tools

      - name: Require current AI evidence
        run: |
          mix ui.status
          mix ui.status --check --source ai_elements --require-verified
        working-directory: tools
