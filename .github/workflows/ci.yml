name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

# The jobs only read the checkout. Nothing writes back.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/live_base
          - packages/live_shadcn
          - packages/live_ai_elements
          - tools
          - storybook
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ matrix.package }}/deps
            ${{ matrix.package }}/_build
          key: ${{ runner.os }}-mix-${{ matrix.package }}-${{ hashFiles(format('{0}/mix.exs', matrix.package)) }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.package }}-

      # Dialyzer's tables take minutes to build and change only when the
      # dependencies do, which is what the mix.lock hash is for.
      - name: Cache dialyzer PLTs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.package }}/priv/plts
          key: ${{ runner.os }}-plt-${{ matrix.package }}-${{ hashFiles(format('{0}/mix.lock', matrix.package)) }}
          restore-keys: ${{ runner.os }}-plt-${{ matrix.package }}-

      - run: mix deps.get
        working-directory: ${{ matrix.package }}

      - run: mix format --check-formatted
        working-directory: ${{ matrix.package }}

      - run: mix compile --warnings-as-errors
        working-directory: ${{ matrix.package }}

      - run: mix test
        working-directory: ${{ matrix.package }}

      # Style and idiom, from one config at the repository root. Generated
      # files are excluded there: a linter that reports on them asks a person to
      # edit a file the pipeline owns.
      - run: mix credo --config-file ../.credo.exs
        working-directory: ${{ matrix.package }}
        if: startsWith(matrix.package, 'packages/') == false

      - run: mix credo --config-file ../../.credo.exs
        working-directory: ${{ matrix.package }}
        if: startsWith(matrix.package, 'packages/')

      # Known vulnerabilities in the dependency tree.
      - run: mix deps.audit
        working-directory: ${{ matrix.package }}

      # Type errors the compiler does not see. It found a call that could never
      # succeed — a string handed to a function that only matches a tuple —
      # which `mix ui.spec` had been rescuing and reporting as the wrong thing.
      - run: mix dialyzer --format short
        working-directory: ${{ matrix.package }}

  # ── What CI checks, and what it deliberately does not ──
  #
  # CI checks that the committed record is internally consistent. It does not
  # open a browser, and it does not fetch upstream.
  #
  # The browser suite used to run here and could not have been working: the job
  # fetched `--only accordion`, `registry/upstream/**` is gitignored, and
  # `parity/` was never installed at all — so the parity server could not build
  # 65 of its 66 references. A check that cannot tell "did not run" from
  # "passed" is worse than no check, and this was one.
  #
  # Verification runs on a developer's machine, where upstream is fetched and
  # the renderer is one known browser. `mix ui.verify` writes its result to
  # `registry/VERIFY.json`, which is committed — and `mix ui.status --check`
  # below refuses an inventory whose verification no longer matches the specs on
  # disk. So CI enforces that somebody verified, without pretending to verify.
  inventory:
    name: the committed record is consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: mix deps.get
        working-directory: tools

      # docs/INVENTORY.md is generated. A stale one is a broken build, and a
      # component whose spec moved since it was verified demotes here.
      - run: mix ui.status --check
        working-directory: tools

      # `mix ui.gen` reads the spec and never the source, so this job needs no
      # parser. `mix ui.spec` does, and the sync workflow is where it runs.

      # So is every component. A file that no longer matches its spec was
      # either generated from an older spec or edited by hand, and neither is
      # allowed.
      - run: mix ui.gen --check
        working-directory: tools

      - run: mix deps.get
        working-directory: storybook

      # The markup a reader gets is committed. A diff here is a change to it,
      # and it renders server-side — no browser, no styling layer, no fetch.
      - run: mix snapshot --check
        working-directory: storybook
