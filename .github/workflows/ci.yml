name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

# The jobs only read the checkout. Nothing writes back.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/live_base
          - packages/live_shadcn
          - packages/live_ai_elements
          - tools
          - storybook
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Resolve toolchain versions
        id: toolchain
        run: |
          echo "erlang=$(mise current erlang)" >> "$GITHUB_OUTPUT"
          echo "elixir=$(elixir --short-version)" >> "$GITHUB_OUTPUT"

      - run: npm ci
        if: matrix.package == 'tools'
        working-directory: tools

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ matrix.package }}/deps
            ${{ matrix.package }}/_build
          key: ${{ runner.os }}-mix-${{ matrix.package }}-${{ hashFiles(format('{0}/mix.exs', matrix.package)) }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.package }}-

      # Dialyzer's tables take minutes to build and change only when the
      # dependencies do, which is what the mix.lock hash is for.
      - name: Cache dialyzer PLTs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.package }}/priv/plts
          key: ${{ runner.os }}-${{ runner.arch }}-plt-v2-${{ steps.toolchain.outputs.erlang }}-${{ steps.toolchain.outputs.elixir }}-${{ matrix.package }}-${{ hashFiles(format('{0}/mix.lock', matrix.package)) }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-plt-v2-${{ steps.toolchain.outputs.erlang }}-${{ steps.toolchain.outputs.elixir }}-${{ matrix.package }}-

      - run: mix deps.get
        working-directory: ${{ matrix.package }}

      - run: mix format --check-formatted
        working-directory: ${{ matrix.package }}

      - run: mix compile --warnings-as-errors
        working-directory: ${{ matrix.package }}

      - run: mix test
        working-directory: ${{ matrix.package }}

      # Style and idiom, from one config at the repository root. Generated
      # files are excluded there: a linter that reports on them asks a person to
      # edit a file the pipeline owns.
      - run: mix credo --config-file ../.credo.exs
        working-directory: ${{ matrix.package }}
        if: startsWith(matrix.package, 'packages/') == false

      - run: mix credo --config-file ../../.credo.exs
        working-directory: ${{ matrix.package }}
        if: startsWith(matrix.package, 'packages/')

      # Known vulnerabilities in the dependency tree.
      - run: mix deps.audit
        working-directory: ${{ matrix.package }}

      # Type errors the compiler does not see. It found a call that could never
      # succeed — a string handed to a function that only matches a tuple —
      # which `mix ui.spec` had been rescuing and reporting as the wrong thing.
      # A local path dependency can change without changing mix.lock. Check a
      # restored PLT before use, so it cannot report a current public function
      # as missing from an older local package build.
      - run: mix dialyzer --force-check --format short
        working-directory: ${{ matrix.package }}

  # ── What CI checks, and what it deliberately does not ──
  #
  # CI checks that the committed record is internally consistent. It does not
  # open a browser, and it does not fetch upstream.
  #
  # The browser suite used to run here and could not have been working: the job
  # fetched `--only accordion`, `registry/upstream/**` is gitignored, and
  # `parity/` was never installed at all — so the parity server could not build
  # 65 of its 66 references. A check that cannot tell "did not run" from
  # "passed" is worse than no check, and this was one.
  #
  # Verification runs on a developer's machine, where upstream is fetched and
  # the renderer is one known browser. `mix ui.verify` writes its result to
  # `registry/VERIFY.json`, which is committed — and `mix ui.status --check`
  # below refuses an inventory whose verification no longer matches the specs on
  # disk. So CI enforces that somebody verified, without pretending to verify.
  inventory:
    name: the committed record is consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: mix deps.get
        working-directory: tools

      # docs/INVENTORY.md is generated. A stale one is a broken build, and a
      # component whose spec moved since it was verified demotes here.
      - run: mix ui.status --check
        working-directory: tools

      # This check reads only committed contracts and reviewed ports. It needs
      # no upstream source and no JavaScript parser.
      - run: mix ui.spec --check --offline
        working-directory: tools

      - run: mix deps.get
        working-directory: storybook

      # The markup a reader gets is committed. A diff here is a change to it,
      # and it renders server-side — no browser, no styling layer, no fetch.
      - run: mix snapshot --check
        working-directory: storybook

      # The production bundle, which nothing else here builds. An import the
      # bundler cannot resolve becomes an external, and an iife then expects a
      # global that is not there: the bundle throws on load and the deployed
      # page has no LiveView at all. `npm ci` is what the image runs, and it is
      # the install that has no accidental `node_modules` to resolve through.
      - run: npm ci
        working-directory: storybook/assets

      - run: npm run build:js -- --minify
        working-directory: storybook/assets

  # ── The one thing the record cannot check about itself ──
  #
  # Every gate above compares two committed things: a component with its spec,
  # the inventory with the verification record, the snapshot with the markup.
  # None of them re-reads upstream, so a spec can drift from the source it was
  # built from and all three stay green — which is what happened. 38 shadcn
  # specs sat stale behind a wholly green build, and one of them was hiding a
  # component whose attribute type had changed.
  #
  # So this job fetches, and it is the only one that does. That is a real cost —
  # a network call, Node, and a parse of every source — and it buys the one
  # question the committed record cannot ask itself: does what is on disk still
  # match what the reader produces from the same file.
  #
  # One run per registry. `--source` exists because three AI Elements components
  # stopped the reader and a gate that cannot run is worse than none; they no
  # longer do, and the split stays anyway — each library is published on its own,
  # each fails for its own reasons, and neither should hide behind the other.
  #
  # `--check` refuses when a source was not read, rather than reporting that the
  # specs it never compared are current. The browser job that used to live here
  # failed exactly that way.
  reader:
    name: every spec still matches its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: mix deps.get
        working-directory: tools

      # `mix ui.spec` parses upstream TypeScript with oxc, which is Node.
      - run: npm ci
        working-directory: tools

      # `registry/upstream/` is gitignored on purpose: this repository records a
      # digest per upstream file rather than redistributing anybody else's
      # source. So the sources have to be fetched before they can be re-read.
      - run: mix ui.fetch
        working-directory: tools
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # One gate per registry, decided rather than left over. `--source` exists
      # because AI Elements could not be read at all; now that it can, two gates
      # are still the right shape. Each library is published on its own and each
      # fails for its own reasons, so one going red must not take the other's
      # gate with it or hide behind it. The build says which library moved.
      - run: mix ui.spec --check --source shadcn
        working-directory: tools

      - run: mix ui.spec --check --source ai_elements
        working-directory: tools

  deploy:
    name: deploy the tested Storybook
    needs: [test, inventory, reader]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: storybook
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false

      - name: Deploy
        run: flyctl deploy --remote-only -c storybook/fly.toml .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
