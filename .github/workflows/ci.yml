name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

# The jobs only read the checkout. Nothing writes back.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/live_base
          - packages/live_shadcn
          - packages/live_ai_elements
          - tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ matrix.package }}/deps
            ${{ matrix.package }}/_build
          key: ${{ runner.os }}-mix-${{ matrix.package }}-${{ hashFiles(format('{0}/mix.exs', matrix.package)) }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.package }}-

      - run: mix deps.get
        working-directory: ${{ matrix.package }}

      - run: mix format --check-formatted
        working-directory: ${{ matrix.package }}

      - run: mix compile --warnings-as-errors
        working-directory: ${{ matrix.package }}

      - run: mix test
        working-directory: ${{ matrix.package }}

  inventory:
    name: inventory is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: mix deps.get
        working-directory: tools

      # docs/INVENTORY.md is generated. A stale one is a broken build.
      - run: mix ui.status --check
        working-directory: tools
