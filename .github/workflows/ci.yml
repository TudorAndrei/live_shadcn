name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every browser check without result reuse
        type: boolean
        default: false

env:
  MIX_ENV: test
  ELIXIR_MAKE_CACHE_DIR: /tmp/live-shadcn-native/elixir-make
  RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH: /tmp/live-shadcn-native/rustler

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the checkout. Nothing writes back.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.package }}
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        package:
          - packages/live_base
          - packages/live_shadcn
          - packages/live_ai_elements
          - tools/verification
          - tools
          - storybook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Resolve toolchain versions
        id: toolchain
        run: |
          echo "erlang=$(mise current erlang)" >> "$GITHUB_OUTPUT"
          echo "elixir=$(elixir --short-version)" >> "$GITHUB_OUTPUT"

      - run: npm ci
        if: matrix.package == 'tools'
        working-directory: tools

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ matrix.package }}/deps
            ${{ matrix.package }}/_build
          key: ${{ runner.os }}-mix-${{ matrix.package }}-${{ hashFiles(format('{0}/mix.exs', matrix.package)) }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.package }}-

      # Dialyzer's tables take minutes to build and change only when the
      # dependencies do, which is what the mix.lock hash is for.
      - name: Cache dialyzer PLTs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.package }}/priv/plts
          key: ${{ runner.os }}-${{ runner.arch }}-plt-v2-${{ steps.toolchain.outputs.erlang }}-${{ steps.toolchain.outputs.elixir }}-${{ matrix.package }}-${{ hashFiles(format('{0}/mix.lock', matrix.package)) }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-plt-v2-${{ steps.toolchain.outputs.erlang }}-${{ steps.toolchain.outputs.elixir }}-${{ matrix.package }}-

      - run: mix deps.get
        working-directory: ${{ matrix.package }}

      - name: Prepare verified native archives
        run: elixir tools/scripts/prepare-native.exs "$PROJECT"
        env:
          PROJECT: ${{ matrix.package }}

      - name: Cache pinned verification sources
        if: matrix.package == 'tools'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            registry/upstream
            parity/.upstream
          key: pinned-upstream-v1-${{ hashFiles('registry/UPSTREAM.json') }}

      - name: Prepare tools integration test inputs
        if: matrix.package == 'tools'
        run: |
          mix ui.fetch --locked
          cd ../storybook
          mix deps.get
          elixir ../tools/scripts/prepare-native.exs .
        working-directory: tools
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Colocated hook blocks are bundled from the packages' assets/js/. A diff
      # here is a hook source edit that `mix ui.hooks` has not written back.
      - run: mix ui.hooks --check
        if: matrix.package == 'tools'
        working-directory: tools

      - run: mix format --check-formatted
        working-directory: ${{ matrix.package }}

      - run: mix compile --warnings-as-errors
        working-directory: ${{ matrix.package }}

      - run: mix test
        working-directory: ${{ matrix.package }}

      # Style and idiom, from one config at the repository root. Generated
      # files are excluded there: a linter that reports on them asks a person to
      # edit a file the pipeline owns.
      - run: mix credo --config-file ../.credo.exs
        working-directory: ${{ matrix.package }}
        if: matrix.package == 'tools' || matrix.package == 'storybook'

      - run: mix credo --config-file ../../.credo.exs
        working-directory: ${{ matrix.package }}
        if: startsWith(matrix.package, 'packages/') || matrix.package == 'tools/verification'

      # Known vulnerabilities in the dependency tree.
      - run: mix deps.audit
        working-directory: ${{ matrix.package }}

      # Type errors the compiler does not see. It found a call that could never
      # succeed — a string handed to a function that only matches a tuple —
      # which `mix ui.spec` had been rescuing and reporting as the wrong thing.
      # A local path dependency can change without changing mix.lock. Check a
      # restored PLT before use, so it cannot report a current public function
      # as missing from an older local package build.
      - run: mix dialyzer --force-check --format short
        working-directory: ${{ matrix.package }}

  # Reject broken contracts and snapshots before starting expensive jobs.
  inventory:
    name: component contracts and snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Resolve compiler versions
        id: toolchain
        run: |
          echo "erlang=$(mise current erlang)" >> "$GITHUB_OUTPUT"
          echo "elixir=$(elixir --short-version)" >> "$GITHUB_OUTPUT"

      - name: Check official references and strict pixel decisions
        run: node --test storybook/test/browser/registries.test.mjs

      - name: Cache preflight dependencies and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tools/deps
            tools/_build
            storybook/deps
            storybook/_build
          key: ${{ runner.os }}-${{ runner.arch }}-preflight-v1-${{ steps.toolchain.outputs.erlang }}-${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('mise.toml', '**/mix.lock', '**/mix.exs') }}

      - run: mix deps.get
        working-directory: tools

      # This check reads only committed contracts and reviewed ports. It needs
      # no upstream source and no JavaScript parser.
      - run: mix ui.spec --check --offline
        working-directory: tools

      - run: mix deps.get
        working-directory: storybook

      - name: Prepare verified native archives
        run: elixir tools/scripts/prepare-native.exs storybook

      # The markup a reader gets is committed. A diff here is a change to it,
      # and it renders server-side — no browser, no styling layer, no fetch.
      - run: mix snapshot --check
        working-directory: storybook

      # The production bundle, which nothing else here builds. An import the
      # bundler cannot resolve becomes an external, and an iife then expects a
      # global that is not there: the bundle throws on load and the deployed
      # page has no LiveView at all. `npm ci` is what the image runs, and it is
      # the install that has no accidental `node_modules` to resolve through.
      - run: npm ci
        working-directory: storybook/assets

      # `mix snapshot --check` compiled the storybook in this job's MIX_ENV,
      # which wrote the colocated hooks under that build path.
      - run: npm run build:js -- --minify
        working-directory: storybook/assets
        env:
          NODE_PATH: ${{ github.workspace }}/storybook/_build/${{ env.MIX_ENV }}

      - name: Plan balanced Shadcn groups
        id: shards
        run: |
          mix ui.verify.plan --source shadcn --shards 16 --output "$RUNNER_TEMP/shadcn-matrix.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          matrix = json.loads((Path(os.environ["RUNNER_TEMP"]) / "shadcn-matrix.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
          PY
        working-directory: tools

      - run: node --test .github/scripts/*.test.mjs

      - run: elixir tools/scripts/prepare-native.test.exs

  shadcn-verification:
    name: Shadcn ${{ matrix.shard }}
    needs: inventory
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --shm-size=1g
    env:
      CI_BROWSER_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 60
    strategy:
      fail-fast: true
      max-parallel: 16
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_key_prefix: mise-browser-noble-v1

      - uses: ./.github/actions/setup-browser # zizmor: ignore[self-repository]
        id: browser
        with:
          source: shadcn
          shard: ${{ matrix.shard }}
          cache-slot: ${{ matrix.index }}
          force: ${{ inputs.full && 'true' || 'false' }}

      - name: Verify assigned components and every example
        shell: bash
        run: |
          options=()
          if [[ "$FORCE" == "true" ]]; then options+=(--force); fi
          mix ui.verify --source shadcn --shard "$SHARD" --reuse "$REUSE_PATH" --batch-size 8 --output "$RUNNER_TEMP/shadcn-$SHARD_INDEX.json" --artifacts "$RUNNER_TEMP/shadcn-browser-$SHARD_INDEX" "${options[@]}"
        working-directory: tools
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_INDEX: ${{ matrix.index }}
          REUSE_PATH: ${{ steps.browser.outputs.reuse-path }}
          FORCE: ${{ inputs.full && 'true' || 'false' }}

      - name: Check saved results can be reused
        id: reuse-check
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: tools
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_INDEX: ${{ matrix.index }}
          REUSE_PATH: ${{ steps.browser.outputs.reuse-path }}
        run: |
          mix ui.verify.cache --source shadcn --shard "$SHARD" --reuse "$REUSE_PATH" --output "$RUNNER_TEMP/cache-check.json"
          node ../.github/scripts/check-cache-plan.mjs "$RUNNER_TEMP/shadcn-$SHARD_INDEX.json" "$RUNNER_TEMP/cache-check.json" "$REUSE_PATH"

      - name: Save passed results for the next run
        if: ${{ !cancelled() && steps.reuse-check.outcome == 'success' && steps.browser.outputs.browser-needed == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser.outputs.reuse-path }}
          key: ${{ steps.browser.outputs.cache-key }}

      - name: Save component verification records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shadcn-verification-${{ matrix.index }}
          path: ${{ runner.temp }}/shadcn-${{ matrix.index }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Save failed browser reports and screenshots
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shadcn-browser-${{ matrix.index }}
          path: ${{ runner.temp }}/shadcn-browser-${{ matrix.index }}
          if-no-files-found: ignore
          retention-days: 7

  shadcn-inventory:
    name: current Shadcn evidence
    needs: [inventory, shadcn-verification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: mix deps.get
        working-directory: tools

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shadcn-verification-*
          path: ${{ runner.temp }}/shadcn-records
          merge-multiple: true

      - name: Merge complete groups without dropping records
        run: node .github/scripts/merge-verification.mjs "$RUNNER_TEMP/shadcn-records" registry/VERIFY.json
        env:
          VERIFICATION_MATRIX: ${{ needs.inventory.outputs.matrix }}

      - name: Require current Shadcn evidence
        run: |
          mix ui.status
          mix ui.status --check --source shadcn --require-verified
        working-directory: tools

      - name: Report the current inventory
        run: cat docs/INVENTORY.md >> "$GITHUB_STEP_SUMMARY"

  # ── The one thing the record cannot check about itself ──
  #
  # Browser comparison does not prove that the source reader captured every
  # upstream fact. 38 shadcn specs sat stale behind a wholly green build, and
  # one of them was hiding a
  # component whose attribute type had changed.
  #
  # This job restores the pinned files and parses every shadcn source. The tools
  # tests also restore pinned files. This reader check proves that the committed
  # specs still match the reader output for those exact files.
  #
  # `--check` refuses when a source was not read, rather than reporting that the
  # specs it never compared are current. The browser job that used to live here
  # failed exactly that way.
  reader:
    name: every spec still matches its source
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: mix deps.get
        working-directory: tools

      # `mix ui.spec` parses upstream TypeScript with oxc, which is Node.
      - run: npm ci
        working-directory: tools

      # `registry/upstream/` is gitignored on purpose: this repository records a
      # digest per upstream file rather than redistributing anybody else's
      # source. So the sources have to be fetched before they can be re-read.
      - name: Cache pinned verification sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            registry/upstream
            parity/.upstream
          key: pinned-upstream-v1-${{ hashFiles('registry/UPSTREAM.json') }}

      - run: mix ui.fetch --locked
        working-directory: tools
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: mix ui.spec --check
        working-directory: tools

  # These tests read the pinned catalog and the browser models without starting
  # Playwright. They make sure a docs-only family cannot lose an official
  # example, its React reference, or a declared visual state between browser
  # verification runs.
  static-browser-contracts:
    name: static browser contracts
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: mix deps.get
        working-directory: tools

      - name: Cache pinned verification sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            registry/upstream
            parity/.upstream
          key: pinned-upstream-v1-${{ hashFiles('registry/UPSTREAM.json') }}

      - name: Restore pinned browser contract inputs
        run: mix ui.fetch --locked
        working-directory: tools
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: npm ci
        working-directory: storybook/test/browser

      - run: node --test ./*.test.mjs
        working-directory: storybook/test/browser

      - run: npm ci
        working-directory: parity

      - run: npm test
        working-directory: parity

  ai-elements-verification:
    needs: inventory
    # Relative workflow calls use this commit. actionlint does not yet accept $/.
    uses: ./.github/workflows/verify-ai-elements.yml # zizmor: ignore[self-repository]
    with:
      full: ${{ inputs.full || false }}

  deploy:
    name: deploy the tested Storybook
    needs: [test, inventory, reader, static-browser-contracts, shadcn-inventory, ai-elements-verification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: storybook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shadcn-verification-*
          path: ${{ runner.temp }}/shadcn-records
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-verification-*
          path: ${{ runner.temp }}/ai-records
          merge-multiple: true

      - name: Restore the complete tested records into the build context
        run: |
          VERIFICATION_MATRIX="$SHADCN_MATRIX" node .github/scripts/merge-verification.mjs "$RUNNER_TEMP/shadcn-records" registry/VERIFY.json
          VERIFICATION_MATRIX="$AI_MATRIX" node .github/scripts/merge-verification.mjs "$RUNNER_TEMP/ai-records" registry/VERIFY.json
        env:
          SHADCN_MATRIX: ${{ needs.inventory.outputs.matrix }}
          AI_MATRIX: ${{ needs.ai-elements-verification.outputs.matrix }}

      - name: Deploy
        run: flyctl deploy --remote-only -c storybook/fly.toml .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
