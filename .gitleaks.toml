# In `dir` mode gitleaks walks the whole working tree, including the git-ignored
# Mix trees. Those hold third-party sources with example keys in their docs.
[extend]
useDefault = true

[[allowlists]]
description = "vendored and build artifacts (deps/, _build/, node_modules/, tools/pkg/)"
paths = [
  '''(^|/)deps/''',
  '''(^|/)_build/''',
  '''(^|/)node_modules/''',
  '''^tools/pkg/''',
]

# `registry/upstream/` is deliberately NOT allowlisted. It holds what
# `mix ui.fetch` downloaded, and everything there should be source or Base UI
# documentation — neither of which carries a token.
#
# It did carry two, and they were the evidence: shadcn's registry index points
# `resizable` and `command` at GitHub repository pages, the fetcher followed the
# links, and GitHub embeds a fresh page token in the HTML it serves. The finding
# was the first sign that the fetcher was storing the wrong thing.
#
# So this scan is the canary. A finding under registry/upstream/ means a fetch
# brought back a web page instead of a source file, and the fix is in
# `mix ui.fetch`, never here.
