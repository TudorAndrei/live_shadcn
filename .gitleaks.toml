# In `dir` mode gitleaks walks the whole working tree, including the git-ignored
# Mix trees. Those hold third-party sources with example keys in their docs.
[extend]
useDefault = true

[[allowlists]]
description = "vendored and build artifacts (deps/, _build/, node_modules/, tools/pkg/)"
paths = [
  '''(^|/)deps/''',
  '''(^|/)_build/''',
  '''(^|/)node_modules/''',
  '''^tools/pkg/''',
]

# `registry/snapshot/` is markup `mix snapshot` renders from the components in
# this repository. Nothing reaches it from outside, and it holds no value a
# person chose. `checkbox` renders `phx-key=" "` beside a `phx-mounted` command
# encoded as JSON, and the pair reads to the generic key rule as a name and a
# high-entropy value.
[[allowlists]]
description = "rendered markup, generated by `mix snapshot`"
paths = ['''^registry/snapshot/''']

# A local `.env` holds the credentials `DEFERRED.md` asks for — a hex API key,
# a Cloudflare token — while somebody is working with them. In `dir` mode
# gitleaks walks the working tree, so it reads that file even though git never
# will: `.gitignore` covers `.env` and `.env.*`, and neither has ever been
# committed.
#
# The paths here are the same two the `.gitignore` entry covers, so a file that
# this skips is a file git cannot commit. Do not widen one without the other.
#
# What this costs, stated rather than hidden: a secret pasted into `.env` is no
# longer reported to the person who pasted it. Only the ignore rule stands
# between it and a commit, so `git add -f .env` is the thing not to do.
[[allowlists]]
description = "local credential files, git-ignored and never committed"
paths = [
  '''^\.env$''',
  '''^\.env\..*$''',
]

# `registry/upstream/` is deliberately NOT allowlisted. It holds what
# `mix ui.fetch` downloaded, which should only ever be source files and Base UI
# documentation. Neither carries a token.
#
# Two files there did. shadcn's registry index points `resizable` and `command`
# at GitHub repository pages, the fetcher followed the links, and GitHub puts a
# fresh page token in the HTML it serves. That finding was the first sign the
# fetcher was storing the wrong thing.
#
# So a finding under registry/upstream/ means a fetch brought back a web page
# instead of a source file. Fix `mix ui.fetch`, not this file.
