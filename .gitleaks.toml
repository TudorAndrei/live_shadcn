# In `dir` mode gitleaks walks the whole working tree, including the git-ignored
# Mix trees. Those hold third-party sources with example keys in their docs.
[extend]
useDefault = true

[[allowlists]]
description = "vendored and build artifacts (deps/, _build/, node_modules/, tools/pkg/)"
paths = [
  '''(^|/)deps/''',
  '''(^|/)_build/''',
  '''(^|/)node_modules/''',
  '''^tools/pkg/''',
]

# `registry/upstream/` is deliberately NOT allowlisted. It holds what
# `mix ui.fetch` downloaded, which should only ever be source files and Base UI
# documentation. Neither carries a token.
#
# Two files there did. shadcn's registry index points `resizable` and `command`
# at GitHub repository pages, the fetcher followed the links, and GitHub puts a
# fresh page token in the HTML it serves. That finding was the first sign the
# fetcher was storing the wrong thing.
#
# So a finding under registry/upstream/ means a fetch brought back a web page
# instead of a source file. Fix `mix ui.fetch`, not this file.
