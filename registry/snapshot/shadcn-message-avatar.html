<!-- shadcn-message / avatar — generated by `mix snapshot`. Do not edit. -->
<div class="flex w-full max-w-sm flex-col gap-6 py-12">
  <div data-slot="message" data-align="start" class="cn-message group/message relative flex w-full min-w-0 data-[align=end]:flex-row-reverse">
    <div data-slot="message-avatar" class="cn-message-avatar flex w-fit shrink-0 items-center justify-center self-end overflow-hidden rounded-full bg-muted">
      <span data-slot="avatar" data-size="default" class="cn-avatar group/avatar relative flex shrink-0 select-none after:absolute after:inset-0 after:border after:border-border after:mix-blend-darken dark:after:mix-blend-lighten ">
        <img data-slot="avatar-image" alt="@avatar" hidden="hidden" src="/avatars/03.png" class="cn-avatar-image aspect-square size-full object-cover "/>
        <span data-slot="avatar-fallback" class="cn-avatar-fallback flex size-full items-center justify-center text-sm group-data-[size=sm]/avatar:text-xs ">
          R
        </span>
      </span>
    </div>
    <div data-slot="message-content" class="cn-message-content flex w-full min-w-0 flex-col wrap-break-word">
      <div data-slot="bubble" data-align="start" data-variant="muted" class="cn-bubble-variant-muted cn-bubble group/bubble relative flex w-fit min-w-0 flex-col">
        <div data-slot="bubble-content" class="cn-bubble-content w-fit max-w-full min-w-0 overflow-hidden wrap-break-word [button]:text-left [button,a]:transition-colors ">
          The build failed during dependency installation.
        </div>
      </div>
    </div>
  </div>
  <div data-slot="message" data-align="end" class="cn-message group/message relative flex w-full min-w-0 data-[align=end]:flex-row-reverse">
    <div data-slot="message-avatar" class="cn-message-avatar flex w-fit shrink-0 items-center justify-center self-end overflow-hidden rounded-full bg-muted">
      <span data-slot="avatar" data-size="default" class="cn-avatar group/avatar relative flex shrink-0 select-none after:absolute after:inset-0 after:border after:border-border after:mix-blend-darken dark:after:mix-blend-lighten ">
        <img data-slot="avatar-image" alt="@avatar" hidden="hidden" src="/avatars/10.png" class="cn-avatar-image aspect-square size-full object-cover "/>
        <span data-slot="avatar-fallback" class="cn-avatar-fallback flex size-full items-center justify-center text-sm group-data-[size=sm]/avatar:text-xs ">
          R
        </span>
      </span>
    </div>
    <div data-slot="message-content" class="cn-message-content flex w-full min-w-0 flex-col wrap-break-word">
      <div data-slot="bubble" data-align="start" data-variant="default" class="cn-bubble-variant-default cn-bubble group/bubble relative flex w-fit min-w-0 flex-col">
        <div data-slot="bubble-content" class="cn-bubble-content w-fit max-w-full min-w-0 overflow-hidden wrap-break-word [button]:text-left [button,a]:transition-colors ">
          Can you share the exact error?
        </div>
      </div>
    </div>
  </div>
  <div data-slot="message" data-align="start" class="cn-message group/message relative flex w-full min-w-0 data-[align=end]:flex-row-reverse">
    <div data-slot="message-avatar" class="cn-message-avatar flex w-fit shrink-0 items-center justify-center self-end overflow-hidden rounded-full bg-muted">
      <span data-slot="avatar" data-size="default" class="cn-avatar group/avatar relative flex shrink-0 select-none after:absolute after:inset-0 after:border after:border-border after:mix-blend-darken dark:after:mix-blend-lighten ">
        <img data-slot="avatar-image" alt="@avatar" hidden="hidden" src="/avatars/03.png" class="cn-avatar-image aspect-square size-full object-cover "/>
        <span data-slot="avatar-fallback" class="cn-avatar-fallback flex size-full items-center justify-center text-sm group-data-[size=sm]/avatar:text-xs ">
          R
        </span>
      </span>
    </div>
    <div data-slot="message-content" class="cn-message-content flex w-full min-w-0 flex-col wrap-break-word">
      <div data-slot="bubble-group" class="cn-bubble-group flex min-w-0 flex-col ">
        <div data-slot="bubble" data-align="start" data-variant="muted" class="cn-bubble-variant-muted cn-bubble group/bubble relative flex w-fit min-w-0 flex-col">
          <div data-slot="bubble-content" class="cn-bubble-content w-fit max-w-full min-w-0 overflow-hidden wrap-break-word [button]:text-left [button,a]:transition-colors ">
            Here&#39;s the error from the logs
          </div>
        </div>
        <div data-slot="bubble" data-align="start" data-variant="muted" class="cn-bubble-variant-muted cn-bubble group/bubble relative flex w-fit min-w-0 flex-col">
          <div data-slot="bubble-content" class="cn-bubble-content w-fit max-w-full min-w-0 overflow-hidden wrap-break-word [button]:text-left [button,a]:transition-colors ">
            Something went wrong with the build. The libraries are not installed correctly. Try running the build again.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
