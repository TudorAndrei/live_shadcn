<!-- bubble / reactions — generated by `mix snapshot`. Do not edit. -->
<div class="flex w-full max-w-sm flex-col gap-12 py-12">
  <div data-slot="bubble" data-align="end" data-variant="muted" class="cn-bubble group/bubble relative flex w-fit min-w-0 flex-col cn-bubble-variant-muted">
    <div data-slot="bubble-content" class="cn-bubble-content w-fit max-w-full min-w-0 overflow-hidden wrap-break-word [button]:text-left [button,a]:transition-colors ">
      I don&#39;t need tests, I know my code works.
    </div>
    <div data-slot="bubble-reactions" role="img" aria-label="Reactions: thumbs up, surprised" data-align="start" data-side="bottom" class="cn-bubble-reactions-align-start cn-bubble-reactions-side-bottom cn-bubble-reactions absolute z-10 flex w-fit items-center justify-center">
      <span>
        👍
      </span>
      <span>
        😮
      </span>
    </div>
  </div>
  <div data-slot="bubble" data-align="start" data-variant="muted" class="cn-bubble group/bubble relative flex w-fit min-w-0 flex-col cn-bubble-variant-muted">
    <div data-slot="bubble-content" class="cn-bubble-content w-fit max-w-full min-w-0 overflow-hidden wrap-break-word [button]:text-left [button,a]:transition-colors ">
      Bold. Fine I&#39;ll add some tests. I&#39;ll let you know when they&#39;re done.
    </div>
    <div data-slot="bubble-reactions" role="img" aria-label="Reactions: eyes, rocket, and 2 more" data-align="end" data-side="bottom" class="cn-bubble-reactions-align-end cn-bubble-reactions-side-bottom cn-bubble-reactions absolute z-10 flex w-fit items-center justify-center">
      <span>
        👀
      </span>
      <span>
        🚀
      </span>
      <span>
        +2
      </span>
    </div>
  </div>
  <div data-slot="bubble" data-align="end" data-variant="default" class="cn-bubble group/bubble relative flex w-fit min-w-0 flex-col cn-bubble-variant-default">
    <div data-slot="bubble-content" class="cn-bubble-content w-fit max-w-full min-w-0 overflow-hidden wrap-break-word [button]:text-left [button,a]:transition-colors ">
      Tests passed on the first try. All 142 of them. Looking good!
    </div>
    <div data-slot="bubble-reactions" role="img" aria-label="Reactions: party popper, clapping hands" data-align="start" data-side="top" class="cn-bubble-reactions-align-start cn-bubble-reactions-side-top cn-bubble-reactions absolute z-10 flex w-fit items-center justify-center">
      <span>
        🎉
      </span>
      <span>
        👏
      </span>
    </div>
  </div>
  <div data-slot="bubble" data-align="start" data-variant="destructive" class="cn-bubble group/bubble relative flex w-fit min-w-0 flex-col cn-bubble-variant-destructive">
    <div data-slot="bubble-content" class="cn-bubble-content w-fit max-w-full min-w-0 overflow-hidden wrap-break-word [button]:text-left [button,a]:transition-colors ">
      Are you sure I can run this command?
    </div>
    <div data-slot="bubble-reactions" data-align="end" data-side="bottom" class="cn-bubble-reactions-align-end cn-bubble-reactions-side-bottom cn-bubble-reactions absolute z-10 flex w-fit items-center justify-center">
      <button data-slot="button" phx-click="bubble_toast" phx-value-message="run-command" class="cn-button group/button inline-flex shrink-0 items-center justify-center whitespace-nowrap transition-all outline-none select-none disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 cn-button-variant-ghost cn-button-size-xs">
        Yes, run it
      </button>
    </div>
  </div>
</div>
