<!-- field / textarea — generated by `mix snapshot`. Do not edit. -->
<fieldset data-slot="field-set" class="cn-field-set flex flex-col w-full max-w-xs">
  <div data-slot="field-group" class="cn-field-group group/field-group @container/field-group flex w-full flex-col">
    <div data-slot="field" role="group" data-orientation="vertical" class="cn-field group/field flex w-full cn-field-orientation-vertical flex-col *:w-full [&amp;&gt;.sr-only]:w-auto">
      <label data-slot="field-label" id="feedback-label" for="feedback" class="cn-label items-center select-none group-data-[disabled=true]:pointer-events-none peer-disabled:cursor-not-allowed cn-field-label group/field-label peer/field-label flex w-fit has-[&gt;[data-slot=field]]:w-full has-[&gt;[data-slot=field]]:flex-col">
        Feedback
      </label>
      <textarea data-slot="textarea" id="feedback" placeholder="Your feedback helps us improve..." rows="4" class="cn-textarea flex field-sizing-content min-h-16 w-full outline-none placeholder:text-muted-foreground disabled:cursor-not-allowed disabled:opacity-50">
      </textarea>
      <p data-slot="field-description" class="cn-field-description leading-normal font-normal group-has-data-horizontal/field:text-balance last:mt-0 nth-last-2:-mt-1 [&amp;&gt;a]:underline [&amp;&gt;a]:underline-offset-4 [&amp;&gt;a:hover]:text-primary ">
        Share your thoughts about our service.
      </p>
    </div>
  </div>
</fieldset>
