<!-- slider / vertical — generated by `mix snapshot`. Do not edit. -->
<div class="mx-auto flex w-full max-w-xs items-center justify-center gap-6">
  <div data-slot="slider" id="slider-vertical-first" role="group" data-orientation="vertical" phx-hook="LiveBase.Slider.Slider" phx-mounted="[[&quot;ignore_attrs&quot;,{&quot;attrs&quot;:[&quot;data-dragging&quot;,&quot;data-focused&quot;,&quot;data-touched&quot;]}]]" class="data-horizontal:w-full data-vertical:h-full h-40">

      <div data-slot="slider-track" data-orientation="vertical" class="cn-slider-track relative grow overflow-hidden select-none">
        <div data-slot="slider-range" data-lb-slider-range="data-lb-slider-range" data-orientation="vertical" class="cn-slider-range select-none data-horizontal:h-full data-vertical:w-full">
        </div>
      </div>
      <div data-slot="slider-thumb" data-index="0" data-lb-slider-thumb="data-lb-slider-thumb" data-orientation="vertical" class="cn-slider-thumb block shrink-0 select-none disabled:pointer-events-none disabled:opacity-50" style="position: absolute">
        <input id="slider-vertical-first-0" type="range" aria-label="First value" data-lb-slider-input="data-lb-slider-input" max="100" min="0" step="1" value="50" class="absolute inset-0 size-full cursor-pointer opacity-0 disabled:cursor-not-allowed"/>
      </div>
    </div>
  </div>
  <div data-slot="slider" id="slider-vertical-second" role="group" data-orientation="vertical" phx-hook="LiveBase.Slider.Slider" phx-mounted="[[&quot;ignore_attrs&quot;,{&quot;attrs&quot;:[&quot;data-dragging&quot;,&quot;data-focused&quot;,&quot;data-touched&quot;]}]]" class="data-horizontal:w-full data-vertical:h-full h-40">
    <div data-orientation="vertical" class="cn-slider relative flex w-full touch-none items-center select-none data-disabled:opacity-50 data-vertical:h-full data-vertical:w-auto data-vertical:flex-col">
      <div data-slot="slider-track" data-orientation="vertical" class="cn-slider-track relative grow overflow-hidden select-none">
        <div data-slot="slider-range" data-lb-slider-range="data-lb-slider-range" data-orientation="vertical" class="cn-slider-range select-none data-horizontal:h-full data-vertical:w-full">
        </div>
      </div>
      <div data-slot="slider-thumb" data-index="0" data-lb-slider-thumb="data-lb-slider-thumb" data-orientation="vertical" class="cn-slider-thumb block shrink-0 select-none disabled:pointer-events-none disabled:opacity-50" style="position: absolute">
        <input id="slider-vertical-second-0" type="range" aria-label="Second value" data-lb-slider-input="data-lb-slider-input" max="100" min="0" step="1" value="25" class="absolute inset-0 size-full cursor-pointer opacity-0 disabled:cursor-not-allowed"/>
      </div>
    </div>
  </div>
</div>
