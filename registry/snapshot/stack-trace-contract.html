<!-- stack-trace / contract — generated by `mix snapshot`. Do not edit. -->
<div class="w-full max-w-xl space-y-4">
  <div class="not-prose w-full overflow-hidden rounded-lg border bg-background font-mono text-sm ">
    <div class="flex w-full cursor-pointer items-center gap-3 p-3 text-left transition-colors hover:bg-muted/50 ">
      <div class="flex flex-1 items-center gap-2 overflow-hidden ">
        <svg aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" class="lucide lucide-triangle-alert size-4 shrink-0 text-destructive">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3">
          </path>
          <path d="M12 9v4">
          </path>
          <path d="M12 17h.01">
          </path>
        </svg>
        <span class="shrink-0 font-semibold text-destructive ">
          ParseError
        </span>
        <span class="truncate text-foreground ">
          Invalid record
        </span>
      </div>
      <button type="button" aria-expanded="true" aria-label="Hide stack frames" phx-click="toggle_trace" phx-target="-1" class="flex size-7 items-center justify-center ">
        <svg aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" class="lucide lucide-chevron-down size-4 text-muted-foreground transition-transform rotate-180">
          <path d="m6 9 6 6 6-6">
          </path>
        </svg>
      </button>
    </div>
    <div id="trace-frames" class="space-y-1 p-3 ">
      <div class="text-xs text-foreground/90">
        <span class="text-muted-foreground">
          at
        </span>
        <span class="text-foreground">
          parse
        </span>
        <span class="text-muted-foreground">
          (
        </span>
        <button type="button" phx-click="[[&quot;push&quot;,{&quot;event&quot;:&quot;select_frame&quot;,&quot;target&quot;:-1}]]" phx-value-column="7" phx-value-line="42" phx-value-path="parser.ex" class="underline decoration-dotted hover:text-primary cursor-pointer">
          parser.ex:42:7
        </button>
        <span class="text-muted-foreground">
          )
        </span>
      </div>
    </div>
  </div>
  <button data-slot="button" type="button" phx-click="show_internal_frames" phx-target="-1" class="cn-button group/button inline-flex shrink-0 items-center justify-center whitespace-nowrap transition-all outline-none select-none disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 cn-button-variant-outline cn-button-size-sm">
    Include internal frames
  </button>
  <div id="empty-trace" class="space-y-1 p-3 ">
    <div class="text-muted-foreground text-xs">
      No stack frames
    </div>
  </div>
</div>
