<!-- node / contract — generated by `mix snapshot`. Do not edit. -->
<section id="ai-media-contract" class="max-w-md space-y-4">
  <div data-slot="card" id="plain-node" class="bg-card text-card-foreground flex flex-col gap-6 rounded-xl border py-6 shadow-sm node-container relative size-full h-auto w-sm gap-0 rounded-md p-0 !gap-0 !rounded-md !p-0">
    <div data-slot="card-content" class="px-6 p-3 !p-3">
      No connections
    </div>
  </div>
  <div data-slot="card" id="connected-node" class="bg-card text-card-foreground flex flex-col gap-6 rounded-xl border py-6 shadow-sm node-container relative size-full h-auto w-sm gap-0 rounded-md p-0 !gap-0 !rounded-md !p-0">
    <span aria-hidden="true" data-node-handle="target" class="absolute -left-1 top-1/2 size-2 -translate-y-1/2 rounded-full border bg-primary">
    </span>
    <span aria-hidden="true" data-node-handle="source" class="absolute -right-1 top-1/2 size-2 -translate-y-1/2 rounded-full border bg-primary">
    </span>
    <div data-slot="card-header" class="@container/card-header grid auto-rows-min grid-rows-[auto_auto] items-start gap-2 px-6 has-data-[slot=card-action]:grid-cols-[1fr_auto] [.border-b]:pb-6 gap-0.5 rounded-t-md border-b bg-secondary p-3! !gap-0.5">
      <div data-slot="card-title" class="leading-none font-semibold text-blue-600">
        Reader
      </div>
      <div data-slot="card-description" class="text-secondary-foreground/80 text-sm">
        Reads the input
      </div>
      <div data-slot="card-action" class="col-start-2 row-span-2 row-start-1 self-start justify-self-end">
        <button type="button" phx-click="run" phx-target="-1">
          Run node
        </button>
      </div>
    </div>
    <div data-slot="card-content" class="px-6 p-3 !p-3">
      input.txt
    </div>
    <div data-slot="card-footer" class="flex items-center px-6 [.border-t]:pt-6 rounded-b-md border-t bg-secondary p-3! !p-3">
      Ready
    </div>
  </div>
</section>
