<!-- trace / status — generated by `mix snapshot`. Do not edit. -->
<div id="native-trace-status" data-phase="initial" phx-hook="ShadcnCodeStreaming" class="contents">
  <div data-slot="trace" class="cn-trace flex w-full min-w-0 flex-col *:has-[&gt;[data-slot=trace-line]]:flex *:has-[&gt;[data-slot=trace-line]]:w-fit *:has-[&gt;[data-slot=trace-line]]:max-w-full *:has-[&gt;[data-slot=trace-line]]:min-w-0 *:has-[&gt;[data-slot=trace-line]]:text-left *:has-[&gt;[data-slot=trace-line]]:outline-none max-w-sm">
    <span data-slot="trace-line" class="cn-trace-line flex w-fit max-w-full min-w-0 items-center text-muted-foreground transition-colors in-[a,button]:cursor-pointer in-[a:hover,button:hover]:text-foreground data-[status=error]:text-destructive data-[status=error]:in-[a:hover,button:hover]:text-destructive data-[status=pending]:opacity-60 data-[status=running]:*:data-[slot=trace-title]:shimmer">
      <span data-slot="trace-icon" aria-hidden="true" class="cn-trace-icon flex shrink-0 items-center justify-center [&amp;_svg]:pointer-events-none">
        <svg aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" class="lucide lucide-circle-check">
          <circle cx="12" cy="12" r="10">
          </circle>
          <path d="m9 12 2 2 4-4">
          </path>
        </svg>
      </span>
      <span data-slot="trace-title" class="cn-trace-title min-w-0 truncate motion-reduce:shimmer-none">
        Ran pnpm install
      </span>
    </span>
    <span data-slot="trace-line" data-status="error" class="cn-trace-line flex w-fit max-w-full min-w-0 items-center text-muted-foreground transition-colors in-[a,button]:cursor-pointer in-[a:hover,button:hover]:text-foreground data-[status=error]:text-destructive data-[status=error]:in-[a:hover,button:hover]:text-destructive data-[status=pending]:opacity-60 data-[status=running]:*:data-[slot=trace-title]:shimmer">
      <span data-slot="trace-icon" aria-hidden="true" class="cn-trace-icon flex shrink-0 items-center justify-center [&amp;_svg]:pointer-events-none">
        <svg aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" class="lucide lucide-circle-alert">
          <circle cx="12" cy="12" r="10">
          </circle>
          <line x1="12" x2="12" y1="8" y2="12">
          </line>
          <line x1="12" x2="12.01" y1="16" y2="16">
          </line>
        </svg>
      </span>
      <span data-slot="trace-title" class="cn-trace-title min-w-0 truncate motion-reduce:shimmer-none">
        Failed to run pnpm lint
      </span>
    </span>
    <span data-slot="trace-line" data-status="running" class="cn-trace-line flex w-fit max-w-full min-w-0 items-center text-muted-foreground transition-colors in-[a,button]:cursor-pointer in-[a:hover,button:hover]:text-foreground data-[status=error]:text-destructive data-[status=error]:in-[a:hover,button:hover]:text-destructive data-[status=pending]:opacity-60 data-[status=running]:*:data-[slot=trace-title]:shimmer">
      <span data-slot="trace-icon" aria-hidden="true" class="cn-trace-icon flex shrink-0 items-center justify-center [&amp;_svg]:pointer-events-none">
        <svg aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" class="lucide lucide-loader-circle animate-spin">
          <path d="M21 12a9 9 0 1 1-6.219-8.56">
          </path>
        </svg>
      </span>
      <span data-slot="trace-title" class="cn-trace-title min-w-0 truncate motion-reduce:shimmer-none">
        Running pnpm build
      </span>
    </span>
    <span data-slot="trace-line" data-status="pending" class="cn-trace-line flex w-fit max-w-full min-w-0 items-center text-muted-foreground transition-colors in-[a,button]:cursor-pointer in-[a:hover,button:hover]:text-foreground data-[status=error]:text-destructive data-[status=error]:in-[a:hover,button:hover]:text-destructive data-[status=pending]:opacity-60 data-[status=running]:*:data-[slot=trace-title]:shimmer">
      <span data-slot="trace-icon" aria-hidden="true" class="cn-trace-icon flex shrink-0 items-center justify-center [&amp;_svg]:pointer-events-none">
        <svg aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" class="lucide lucide-circle">
          <circle cx="12" cy="12" r="10">
          </circle>
        </svg>
      </span>
      <span data-slot="trace-title" class="cn-trace-title min-w-0 truncate motion-reduce:shimmer-none">
        Run pnpm test
      </span>
    </span>
  </div>
</div>
