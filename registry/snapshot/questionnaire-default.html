<!-- questionnaire / default — generated by `mix snapshot`. Do not edit. -->
<form data-slot="questionnaire" class="cn-questionnaire flex w-full min-w-0 flex-col ">
  <div data-slot="questionnaire-progress" class="cn-questionnaire-progress min-h-[1lh] w-fit min-w-[14ch] font-medium text-muted-foreground tabular-nums ">
    1 of 2
  </div>
  <fieldset data-slot="questionnaire-item" class="cn-questionnaire-item min-w-0 border-0 p-0 outline-none ">
    <legend data-slot="questionnaire-title" class="cn-questionnaire-title cn-font-heading text-pretty ">
      How should the server filter commands?
    </legend>
    <p data-slot="questionnaire-description" class="cn-questionnaire-description text-pretty text-muted-foreground ">
      Choose one behaviour for each keystroke.
    </p>
    <div data-slot="questionnaire-choices" class="cn-questionnaire-choices group/questionnaire-choices grid min-w-0 mt-4 gap-2">
      <label data-slot="questionnaire-choice" class="cn-questionnaire-choice group/questionnaire-choice relative flex min-h-11 cursor-pointer items-start text-start transition-colors outline-none select-none data-disabled:pointer-events-none data-disabled:cursor-not-allowed data-disabled:opacity-50 ">
        <input data-slot="questionnaire-choice-input" type="radio" class="cn-questionnaire-choice-input absolute inset-0 z-10 size-full cursor-pointer opacity-0"/>
        <span data-slot="questionnaire-choice-indicator" aria-hidden="true" class="cn-questionnaire-choice-indicator pointer-events-none relative flex shrink-0 items-center justify-center border group-data-[type=radio]/questionnaire-choice:rounded-full">
          <span data-slot="questionnaire-choice-indicator-dot" class="cn-questionnaire-choice-indicator-dot hidden rounded-full group-data-[type=checkbox]/questionnaire-choice:hidden group-data-checked/questionnaire-choice:block">
          </span>
          <svg data-slot="questionnaire-choice-indicator-check" aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" class="lucide lucide-check cn-questionnaire-choice-indicator-check hidden group-data-[type=radio]/questionnaire-choice:hidden group-data-checked/questionnaire-choice:block">
            <path d="M20 6 9 17l-5-5">
            </path>
          </svg>
        </span>
        <span data-slot="questionnaire-choice-label" class="cn-questionnaire-choice-label cn-questionnaire-choice-content flex min-w-0 flex-1 flex-col leading-snug">
          On the server
          <span data-slot="questionnaire-choice-description" class="cn-questionnaire-choice-description ">
            One round trip per keystroke.
          </span>
        </span>
      </label>
      <label data-slot="questionnaire-choice" class="cn-questionnaire-choice group/questionnaire-choice relative flex min-h-11 cursor-pointer items-start text-start transition-colors outline-none select-none data-disabled:pointer-events-none data-disabled:cursor-not-allowed data-disabled:opacity-50 ">
        <input data-slot="questionnaire-choice-input" type="radio" class="cn-questionnaire-choice-input absolute inset-0 z-10 size-full cursor-pointer opacity-0"/>
        <span data-slot="questionnaire-choice-indicator" aria-hidden="true" class="cn-questionnaire-choice-indicator pointer-events-none relative flex shrink-0 items-center justify-center border group-data-[type=radio]/questionnaire-choice:rounded-full">
          <span data-slot="questionnaire-choice-indicator-dot" class="cn-questionnaire-choice-indicator-dot hidden rounded-full group-data-[type=checkbox]/questionnaire-choice:hidden group-data-checked/questionnaire-choice:block">
          </span>
          <svg data-slot="questionnaire-choice-indicator-check" aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" class="lucide lucide-check cn-questionnaire-choice-indicator-check hidden group-data-[type=radio]/questionnaire-choice:hidden group-data-checked/questionnaire-choice:block">
            <path d="M20 6 9 17l-5-5">
            </path>
          </svg>
        </span>
        <span data-slot="questionnaire-choice-label" class="cn-questionnaire-choice-label cn-questionnaire-choice-content flex min-w-0 flex-1 flex-col leading-snug">
          In the browser
          <span data-slot="questionnaire-choice-description" class="cn-questionnaire-choice-description ">
            Keep a second copy of the list.
          </span>
        </span>
      </label>
    </div>
  </fieldset>
</form>
