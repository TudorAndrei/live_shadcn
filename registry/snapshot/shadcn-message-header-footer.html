<!-- shadcn-message / header-footer — generated by `mix snapshot`. Do not edit. -->
<div class="flex w-full max-w-sm flex-col gap-8 py-12">
  <div data-slot="message" data-align="start" class="cn-message group/message relative flex w-full min-w-0 data-[align=end]:flex-row-reverse">
    <div data-slot="message-content" class="cn-message-content flex w-full min-w-0 flex-col wrap-break-word">
      <div data-slot="message-header" class="cn-message-header flex max-w-full min-w-0 items-center">
        Olivia
      </div>
      <div data-slot="bubble" data-align="start" data-variant="muted" class="cn-bubble-variant-muted cn-bubble group/bubble relative flex w-fit min-w-0 flex-col">
        <div data-slot="bubble-content" class="cn-bubble-content w-fit max-w-full min-w-0 overflow-hidden wrap-break-word [button]:text-left [button,a]:transition-colors ">
          I already checked the logs.
        </div>
      </div>
    </div>
  </div>
  <div data-slot="message" data-align="end" class="cn-message group/message relative flex w-full min-w-0 data-[align=end]:flex-row-reverse">
    <div data-slot="message-content" class="cn-message-content flex w-full min-w-0 flex-col wrap-break-word">
      <div data-slot="bubble" data-align="start" data-variant="default" class="cn-bubble-variant-default cn-bubble group/bubble relative flex w-fit min-w-0 flex-col">
        <div data-slot="bubble-content" class="cn-bubble-content w-fit max-w-full min-w-0 overflow-hidden wrap-break-word [button]:text-left [button,a]:transition-colors ">
          Send the report to the team. Ping @shadcn if you need help.
        </div>
      </div>
      <div data-slot="message-footer" class="cn-message-footer flex max-w-full min-w-0 items-center group-data-[align=end]/message:justify-end">
        <div>
          Read
          <span class="font-normal">
            Yesterday
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
