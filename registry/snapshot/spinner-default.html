<!-- spinner / default — generated by `mix snapshot`. Do not edit. -->
<div class="flex w-full max-w-xs flex-col gap-4 [--radius:1rem]">
  <div data-slot="item" data-size="default" data-variant="muted" class="cn-item group/item flex w-full flex-wrap items-center transition-colors duration-100 outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 [a]:transition-colors cn-item-variant-muted cn-item-size-default">
    <div data-slot="item-media" data-variant="default" class="cn-item-media flex shrink-0 items-center justify-center [&amp;_svg]:pointer-events-none cn-item-media-variant-default">
      <svg data-slot="spinner" role="status" aria-label="Loading" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" class="lucide lucide-loader-circle size-4 animate-spin">
        <path d="M21 12a9 9 0 1 1-6.219-8.56">
        </path>
      </svg>
    </div>
    <div data-slot="item-content" class="cn-item-content flex flex-1 flex-col [&amp;+[data-slot=item-content]]:flex-none">
      <div data-slot="item-title" class="cn-item-title w-fit items-center line-clamp-1">
        Processing payment...
      </div>
    </div>
    <div data-slot="item-content" class="cn-item-content flex flex-col [&amp;+[data-slot=item-content]]:flex-none flex-none justify-end">
      <span class="text-sm tabular-nums">
        $100.00
      </span>
    </div>
  </div>
</div>
