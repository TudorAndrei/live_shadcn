<!-- questionnaire / shortcuts — generated by `mix snapshot`. Do not edit. -->
<div class="relative mx-auto flex h-full w-full max-w-md flex-col">
  <div data-slot="native-select-wrapper" data-size="default" class="cn-native-select-wrapper group/native-select w-fit has-[select:disabled]:opacity-50 absolute end-0 top-0">
    <select data-slot="native-select" name="shortcut_mode" aria-label="Shortcut style" data-size="default" form="questionnaire-shortcuts" phx-change="questionnaire_shortcuts" class="cn-native-select outline-none disabled:pointer-events-none disabled:cursor-not-allowed">
      <option data-slot="native-select-option" value="none" class="bg-[Canvas] text-[CanvasText]">
        No shortcuts
      </option>
      <option data-slot="native-select-option" selected="selected" value="letters" class="bg-[Canvas] text-[CanvasText]">
        Letters
      </option>
      <option data-slot="native-select-option" value="numbers" class="bg-[Canvas] text-[CanvasText]">
        Numbers
      </option>
    </select>
    <svg data-slot="native-select-icon" aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" class="lucide lucide-chevron-down cn-native-select-icon pointer-events-none absolute select-none">
      <path d="m6 9 6 6 6-6">
      </path>
    </svg>
  </div>
  <form data-slot="questionnaire" id="questionnaire-shortcuts" data-default-item="action" data-lb-items="[{&quot;name&quot;:&quot;action&quot;,&quot;required&quot;:true,&quot;choices&quot;:[{&quot;value&quot;:&quot;inspect&quot;},{&quot;value&quot;:&quot;tests&quot;},{&quot;value&quot;:&quot;patch&quot;}]}]" data-lb-questionnaire="data-lb-questionnaire" data-shortcuts="letters" phx-hook="LiveBase.Questionnaire.Questionnaire" class="cn-questionnaire flex w-full min-w-0 flex-col mt-auto">
    <fieldset data-slot="questionnaire-item" data-questionnaire-name="action" data-required="" class="cn-questionnaire-item min-w-0 border-0 p-0 outline-none">
      <legend data-slot="questionnaire-title" class="cn-questionnaire-title cn-font-heading text-pretty">
        What should the agent do next?
      </legend>
      <p data-slot="questionnaire-description" class="cn-questionnaire-description text-pretty text-muted-foreground">
        Use the displayed shortcut or navigate with the keyboard.
      </p>
      <div data-slot="questionnaire-choices" class="cn-questionnaire-choices group/questionnaire-choices grid min-w-0">
        <label data-slot="questionnaire-choice" name="action" data-type="radio" class="cn-questionnaire-choice group/questionnaire-choice relative flex min-h-11 cursor-pointer items-start text-start transition-colors outline-none select-none data-disabled:pointer-events-none data-disabled:cursor-not-allowed data-disabled:opacity-50">
          <input data-slot="questionnaire-choice-input" name="action" type="radio" value="inspect" class="cn-questionnaire-choice-input absolute inset-0 z-10 size-full cursor-pointer opacity-0"/>
          <span data-slot="questionnaire-choice-indicator" aria-hidden="true" class="cn-questionnaire-choice-indicator pointer-events-none relative flex shrink-0 items-center justify-center border group-data-[type=radio]/questionnaire-choice:rounded-full">
            <span data-slot="questionnaire-choice-indicator-dot" class="cn-questionnaire-choice-indicator-dot hidden rounded-full group-data-[type=checkbox]/questionnaire-choice:hidden group-data-checked/questionnaire-choice:block">
            </span>
            <svg data-slot="questionnaire-choice-indicator-check" aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" class="lucide lucide-check cn-questionnaire-choice-indicator-check hidden group-data-[type=radio]/questionnaire-choice:hidden group-data-checked/questionnaire-choice:block">
              <path d="M20 6 9 17l-5-5">
              </path>
            </svg>
          </span>
          <span data-slot="questionnaire-choice-label" class="cn-questionnaire-choice-label cn-questionnaire-choice-content flex min-w-0 flex-1 flex-col leading-snug">
            Inspect the implementation
          </span>
          <span data-slot="questionnaire-choice-shortcut" aria-hidden="true" hidden="hidden" class="cn-questionnaire-choice-shortcut cn-questionnaire-shortcut pointer-events-none ms-auto hidden shrink-0 group-data-[shortcut]/questionnaire-choice:inline-flex">
          </span>
        </label>
        <label data-slot="questionnaire-choice" name="action" data-type="radio" class="cn-questionnaire-choice group/questionnaire-choice relative flex min-h-11 cursor-pointer items-start text-start transition-colors outline-none select-none data-disabled:pointer-events-none data-disabled:cursor-not-allowed data-disabled:opacity-50">
          <input data-slot="questionnaire-choice-input" name="action" type="radio" value="tests" class="cn-questionnaire-choice-input absolute inset-0 z-10 size-full cursor-pointer opacity-0"/>
          <span data-slot="questionnaire-choice-indicator" aria-hidden="true" class="cn-questionnaire-choice-indicator pointer-events-none relative flex shrink-0 items-center justify-center border group-data-[type=radio]/questionnaire-choice:rounded-full">
            <span data-slot="questionnaire-choice-indicator-dot" class="cn-questionnaire-choice-indicator-dot hidden rounded-full group-data-[type=checkbox]/questionnaire-choice:hidden group-data-checked/questionnaire-choice:block">
            </span>
            <svg data-slot="questionnaire-choice-indicator-check" aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" class="lucide lucide-check cn-questionnaire-choice-indicator-check hidden group-data-[type=radio]/questionnaire-choice:hidden group-data-checked/questionnaire-choice:block">
              <path d="M20 6 9 17l-5-5">
              </path>
            </svg>
          </span>
          <span data-slot="questionnaire-choice-label" class="cn-questionnaire-choice-label cn-questionnaire-choice-content flex min-w-0 flex-1 flex-col leading-snug">
            Run the relevant tests
          </span>
          <span data-slot="questionnaire-choice-shortcut" aria-hidden="true" hidden="hidden" class="cn-questionnaire-choice-shortcut cn-questionnaire-shortcut pointer-events-none ms-auto hidden shrink-0 group-data-[shortcut]/questionnaire-choice:inline-flex">
          </span>
        </label>
        <label data-slot="questionnaire-choice" name="action" data-type="radio" class="cn-questionnaire-choice group/questionnaire-choice relative flex min-h-11 cursor-pointer items-start text-start transition-colors outline-none select-none data-disabled:pointer-events-none data-disabled:cursor-not-allowed data-disabled:opacity-50">
          <input data-slot="questionnaire-choice-input" name="action" type="radio" value="patch" class="cn-questionnaire-choice-input absolute inset-0 z-10 size-full cursor-pointer opacity-0"/>
          <span data-slot="questionnaire-choice-indicator" aria-hidden="true" class="cn-questionnaire-choice-indicator pointer-events-none relative flex shrink-0 items-center justify-center border group-data-[type=radio]/questionnaire-choice:rounded-full">
            <span data-slot="questionnaire-choice-indicator-dot" class="cn-questionnaire-choice-indicator-dot hidden rounded-full group-data-[type=checkbox]/questionnaire-choice:hidden group-data-checked/questionnaire-choice:block">
            </span>
            <svg data-slot="questionnaire-choice-indicator-check" aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" class="lucide lucide-check cn-questionnaire-choice-indicator-check hidden group-data-[type=radio]/questionnaire-choice:hidden group-data-checked/questionnaire-choice:block">
              <path d="M20 6 9 17l-5-5">
              </path>
            </svg>
          </span>
          <span data-slot="questionnaire-choice-label" class="cn-questionnaire-choice-label cn-questionnaire-choice-content flex min-w-0 flex-1 flex-col leading-snug">
            Prepare the patch
          </span>
          <span data-slot="questionnaire-choice-shortcut" aria-hidden="true" hidden="hidden" class="cn-questionnaire-choice-shortcut cn-questionnaire-shortcut pointer-events-none ms-auto hidden shrink-0 group-data-[shortcut]/questionnaire-choice:inline-flex">
          </span>
        </label>
      </div>
      <p data-slot="questionnaire-error" hidden="hidden" class="cn-questionnaire-error text-destructive">
        Choose an answer to continue.
      </p>
    </fieldset>
    <div data-slot="questionnaire-actions" class="cn-questionnaire-actions grid min-h-11 w-full grid-cols-[minmax(0,1fr)_auto_auto] items-center">
      <button data-slot="questionnaire-submit" type="submit" data-questionnaire-action="submit" data-size="default" data-variant="default" class="cn-button group/button inline-flex shrink-0 items-center justify-center whitespace-nowrap transition-all outline-none select-none disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 cn-button-variant-default cn-button-size-default cn-questionnaire-submit col-start-3 row-start-1 min-h-11 justify-self-end sm:min-h-0">
        Confirm action
      </button>
    </div>
  </form>
</div>
